{{- $unitName := required "unitName is required" .Values.unitName -}}
{{- $imageRepository := required "image.repository is required" .Values.image.repository -}}
{{- $sourceRevision := required "sourceRevision is required" .Values.sourceRevision -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $unitName }}
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ $unitName }}
  template:
    metadata:
      labels:
        app: {{ $unitName }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $unitName }}
          image: "{{ $imageRepository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ $unitName }}-app
          env:
            - name: TZ
              value: Europe/Berlin
            - name: Application__SourceRevision
              value: {{ $sourceRevision | quote }}
            {{- if .Values.recognizedAudioCapture.enabled }}
            - name: SPRECHEN_RECOGNIZED_AUDIO_DUMP_DIR
              value: {{ .Values.recognizedAudioCapture.directory | quote }}
            {{- end }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              name: h2c
            - containerPort: {{ .Values.service.healthPort }}
              name: http
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readinessPath }}
              port: {{ .Values.service.healthPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.livenessPath }}
              port: {{ .Values.service.healthPort }}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
          {{- if .Values.recognizedAudioCapture.enabled }}
          volumeMounts:
            - name: recognized-audio
              mountPath: {{ .Values.recognizedAudioCapture.directory }}
          {{- end }}
        {{- if .Values.recognizedAudioCapture.enabled }}
        - name: recognized-audio-access
          image: {{ .Values.recognizedAudioCapture.accessImage | quote }}
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: recognized-audio
              mountPath: {{ .Values.recognizedAudioCapture.directory }}
              readOnly: true
        {{- end }}
      {{- if .Values.recognizedAudioCapture.enabled }}
      volumes:
        - name: recognized-audio
          emptyDir:
            sizeLimit: {{ .Values.recognizedAudioCapture.sizeLimit }}
      {{- end }}
