{{- $unitName := required "unitName is required" .Values.unitName }}
{{- $metadataDomain := required "metadataDomain is required" .Values.metadataDomain }}
{{- if ne (int .Values.replicaCount) 1 }}
{{- fail "replicaCount must be exactly 1 because the study telemetry JSONL sink has a single writer" }}
{{- end }}
{{- $imageTag := required "image.tag is required" .Values.image.tag }}
{{- if not (regexMatch "^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$" $imageTag) }}
{{- fail "image.tag must be a plain image tag" }}
{{- end }}
{{- $imageRepository := required "image.repository is required" .Values.image.repository }}
{{- if not (regexMatch "^[a-zA-Z0-9._/-]+$" $imageRepository) }}
{{- fail "image.repository must not contain a tag or digest" }}
{{- end }}
{{- $sourceRevision := required "sourceRevision is required" .Values.sourceRevision }}
{{- if not (regexMatch "^[0-9a-f]{40}$" $sourceRevision) }}
{{- fail "sourceRevision must be an exact 40-character Git SHA" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $unitName }}
  namespace: {{ .Values.namespace }}
  annotations:
    {{ $metadataDomain }}/source-revision: {{ $sourceRevision | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ $unitName }}
  template:
    metadata:
      labels:
        app: {{ $unitName }}
        {{ $metadataDomain }}/release: {{ $sourceRevision | quote }}
      annotations:
        {{ $metadataDomain }}/source-revision: {{ $sourceRevision | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $unitName }}
          image: "{{ $imageRepository }}:{{ $imageTag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          envFrom:
            - secretRef:
                name: {{ $unitName }}-app
          env:
            - name: TZ
              value: Europe/Berlin
            - name: Application__SourceRevision
              value: {{ $sourceRevision | quote }}
            - name: ContractsService__BaseAddress
              value: {{ required "contractsService.baseAddress is required" .Values.contractsService.baseAddress | quote }}
            - name: EvaluationTelemetry__JsonlStore__DataDirectory
              value: "/data/generation-3"
            - name: EvaluationTelemetry__JsonlStore__IsEnabled
              value: "true"
            - name: EvaluationTelemetry__Archive__IsEnabled
              value: "true"
            - name: EvaluationTelemetry__OperationalProbeAdmission__IsEnabled
              value: "true"
            - name: EvaluationTelemetry__IngressBoundary__TrustForwardedClientAddress
              value: "true"
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              name: http
            - containerPort: {{ .Values.service.healthPort }}
              name: health
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readinessPath }}
              port: {{ .Values.service.healthPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.livenessPath }}
              port: {{ .Values.service.healthPort }}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
          volumeMounts:
            - name: evaluation-telemetry-ledger
              mountPath: /data
            - name: dataprotection-keys
              mountPath: /home/app/.aspnet/DataProtection-Keys
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: dataprotection-keys
          emptyDir:
            sizeLimit: 8Mi
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
        - name: evaluation-telemetry-ledger
          persistentVolumeClaim:
            claimName: {{ $unitName }}-evaluation-telemetry-ledger
