name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x

      - name: Install WebAssembly tooling
        run: dotnet workload install wasm-tools

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/**/package-lock.json

      # Not every project is listed in src/Sprechen.slnx. The CI solution
      # therefore contains every project under src, so all test projects run.
      - name: Create CI solution with all projects
        run: |
          dotnet new sln --name All --format slnx --output "$RUNNER_TEMP/ci"
          find src -name '*.csproj' -not -path '*/.vs/*' -print0 \
            | xargs -0 dotnet sln "$RUNNER_TEMP/ci/All.slnx" add
          echo "Projects: $(grep -c '\.csproj' "$RUNNER_TEMP/ci/All.slnx")"

      - name: Restore
        run: dotnet restore "$RUNNER_TEMP/ci/All.slnx" --configfile nuget.config

      - name: Build
        run: dotnet build "$RUNNER_TEMP/ci/All.slnx" --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test "$RUNNER_TEMP/ci/All.slnx"
          --configuration Release
          --no-build
          --filter "FullyQualifiedName!~CaptureHarnessBrowserTests"
          --logger trx
          --collect "XPlat Code Coverage"
          --results-directory "$RUNNER_TEMP/test-results"
          --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Verify MicroSharp capture in Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright
        run: |
          set -euo pipefail
          harness_tests=src/speech/Sprechen.Speech.MicrophoneBrowserHarness.Tests
          pwsh "$harness_tests/bin/Release/net11.0/playwright.ps1" install --with-deps chromium
          feed="$RUNNER_TEMP/microsharp-reference"
          mkdir -p "$feed"
          curl --fail --silent --show-error --retry 3 \
            https://api.nuget.org/v3-flatcontainer/microsharp.browser/0.1.0/microsharp.browser.0.1.0.nupkg \
            --output "$feed/MicroSharp.Browser.0.1.0.nupkg"
          bash scripts/run-microphone-browser-harness.sh "$feed" "$RUNNER_TEMP/microphone-harness" --nuget-org

      - name: Merge coverage reports
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            "-reports:$RUNNER_TEMP/test-results/*/coverage.cobertura.xml" \
            "-targetdir:$RUNNER_TEMP/coverage" \
            "-reporttypes:Cobertura;MarkdownSummaryGithub" \
            "-filefilters:-**/obj/**" \
            "-assemblyfilters:-*.TestDoubles"
          cat "$RUNNER_TEMP/coverage/SummaryGithub.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ${{ runner.temp }}/test-results/*.trx
            ${{ runner.temp }}/coverage/Cobertura.xml
          if-no-files-found: ignore

      - name: Upload coverage to Codacy
        if: env.CODACY_PROJECT_TOKEN != ''
        run: bash <(curl -Ls https://coverage.codacy.com/get.sh) report -r "$RUNNER_TEMP/coverage/Cobertura.xml"
