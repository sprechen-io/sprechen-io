name: Codacy AI review gate

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:

permissions:
  checks: write
  contents: read
  pull-requests: read

concurrency:
  group: codacy-ai-review-gate
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Run only the gate script from the trusted default branch.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch || github.ref_name }}
          persist-credentials: false
      - run: python3 .github/scripts/test_codacy_review_gate.py
      - run: python3 .github/scripts/codacy_review_gate.py
        env:
          GH_TOKEN: ${{ github.token }}
